<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Our Canvas</title>
<link rel="stylesheet" href="style.css">
<script>
  // theme before first paint (no flash)
  try {
    const t = localStorage.getItem('ourcanvas_theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<!-- ============ LOCK ============ -->
<div id="screen-lock" class="screen hidden">
  <div class="lock-card">
    <div class="app-icon">🎨</div>
    <h1>Our Canvas</h1>
    <p class="subtitle">For Abi &amp; Percy — nobody else.</p>
    <div id="lock-form">
      <input id="inp-password" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
      <button id="btn-unlock" class="btn-accent">Unlock</button>
      <p id="lock-hint" class="hint"></p>
    </div>
    <div id="lock-blocked" class="hidden">
      <p class="blocked-title">🚫 This device is blocked</p>
      <p id="blocked-msg" class="hint"></p>
    </div>
    <p id="lock-error" class="error"></p>
  </div>
</div>

<!-- ============ NAME (one time) ============ -->
<div id="screen-name" class="screen hidden">
  <div class="lock-card">
    <div class="app-icon">👋</div>
    <h1>Hey, you.</h1>
    <p class="subtitle">What should we call you? Just this once.</p>
    <input id="inp-myname" type="text" maxlength="16" placeholder="Your name" autocomplete="off" enterkeyhint="done">
    <button id="btn-savename" class="btn-accent">Start drawing</button>
    <p id="name-error" class="error"></p>
  </div>
</div>

<!-- ============ CANVAS ============ -->
<div id="screen-canvas" class="screen hidden">
  <canvas id="board"></canvas>

  <div id="topbar" class="glass">
    <span class="app-title">Our Canvas</span>
    <div class="top-actions">
      <button id="btn-theme" class="pill-btn" title="appearance">🌙</button>
      <button id="btn-undo" class="pill-btn" title="undo">↩</button>
      <button id="btn-redo" class="pill-btn" title="redo">↪</button>
      <button id="btn-clear" class="pill-btn" title="clear">🗑</button>
      <button id="btn-lock" class="pill-btn" title="lock">🔒</button>
    </div>
  </div>

  <div id="peer-toast" class="peer-toast hidden"></div>

  <div id="toolbar" class="glass">
    <div id="tools-row" class="tools-row">
      <button class="tool active" data-tool="pen" title="Pen">🖊</button>
      <button class="tool" data-tool="pencil" title="Pencil">✏</button>
      <button class="tool" data-tool="marker" title="Marker">🖍</button>
      <button class="tool" data-tool="highlighter" title="Highlighter">🖌</button>
      <button class="tool" data-tool="neon" title="Neon glow">💡</button>
      <button class="tool" data-tool="eraser" title="Eraser">🧽</button>
      <button class="tool" data-tool="line" title="Line">📏</button>
      <button class="tool" data-tool="rect" title="Rectangle">▢</button>
      <button class="tool" data-tool="circle" title="Circle">○</button>
      <button class="tool" data-tool="text" title="Text">T</button>
      <button class="tool" data-tool="pan" title="Move">✋</button>
    </div>
    <div class="controls-row">
      <div id="colors-row" class="colors-row"></div>
      <input id="inp-size" type="range" min="2" max="48" value="8" title="brush size">
    </div>
  </div>

  <div id="text-overlay" class="glass hidden">
    <input id="inp-text" type="text" maxlength="200" placeholder="Write something…">
    <div class="text-btns">
      <button id="btn-text-ok" class="btn-accent small">Place</button>
      <button id="btn-text-cancel" class="btn-ghost small">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
