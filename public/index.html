<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff2d55">
<title>Our Canvas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // theme before first paint (no flash)
  try {
    const t = localStorage.getItem('ourcanvas_theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<!-- ============ LOCK ============ -->
<div id="screen-lock" class="screen hidden">
  <div class="lock-card">
    <div class="app-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L8 21l-5 1 1-5L14.5 4.5z"/><path d="M13 6l5 5"/></svg>
    </div>
    <div id="lock-form">
      <div id="otp-row" class="otp-row">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 2">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 3">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 4">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 5">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 6">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 7">
        <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 8" enterkeyhint="go">
      </div>
      <div class="otp-tools">
        <button class="eye-btn" aria-label="Show password" aria-pressed="false">
          <svg class="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ic-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="23" x2="23" y2="1"/></svg>
        </button>
      </div>
      <p id="lock-hint" class="hint"></p>
    </div>
    <div id="lock-blocked" class="hidden">
      <p class="blocked-title">This device is blocked</p>
      <p id="blocked-msg" class="hint"></p>
    </div>
    <p id="lock-error" class="error"></p>
  </div>
</div>

<!-- ============ CONFIRM CLEAR ============ -->
<div id="confirm-clear" class="sheet-wrap hidden">
  <div class="sheet glass" id="confirm-card">
    <p class="sheet-title">Clear the canvas?</p>
    <p class="hint">This wipes everything for both of you.<br>Enter the password to confirm.</p>
    <div id="confirm-otp-row" class="otp-row">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 1">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 2">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 3">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 4">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 5">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 6">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 7">
      <input class="otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 8" enterkeyhint="go">
    </div>
    <div class="otp-tools">
      <button class="eye-btn" aria-label="Show password" aria-pressed="false">
        <svg class="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="ic-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="23" x2="23" y2="1"/></svg>
      </button>
    </div>
    <p id="confirm-error" class="error"></p>
    <button id="btn-confirm-cancel" class="btn-ghost">Cancel</button>
  </div>
</div>

<!-- ============ NAME (one time) ============ -->
<div id="screen-name" class="screen hidden">
  <div class="lock-card">
    <div class="app-icon alt">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 00-16 0"/><circle cx="12" cy="8" r="4.5"/></svg>
    </div>
    <h1>Hey, you.</h1>
    <p class="subtitle">What should we call you? Just this once.</p>
    <input id="inp-myname" type="text" maxlength="16" placeholder="Your name" autocomplete="off" enterkeyhint="done">
    <button id="btn-savename" class="btn-accent">Start drawing</button>
    <p id="name-error" class="error"></p>
  </div>
</div>

<!-- ============ CANVAS ============ -->
<div id="screen-canvas" class="screen hidden">
  <canvas id="board"></canvas>

  <!-- playful loading overlay while the canvas is being fetched -->
  <div id="canvas-loader" class="canvas-loader hidden">
    <div class="loader-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L8 21l-5 1 1-5L14.5 4.5z"/><path d="M13 6l5 5"/></svg>
    </div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
    <p class="loader-text">Preparing your canvas…</p>
  </div>

  <div id="brush-ring"></div>

  <div id="topbar" class="glass">
    <div class="top-left">
      <span class="app-title">Our Canvas</span>
      <div id="conn-pill" class="conn-pill connecting" title="Server connection">
        <span class="conn-dot"></span><span id="conn-text">Connecting…</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-theme" class="pill-btn" title="appearance">
        <svg id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1110.5 4 6.5 6.5 0 0020 13.5z"/></svg>
        <svg id="ic-sun" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      </button>
      <button id="btn-undo" class="pill-btn" title="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h9.5a5.5 5.5 0 010 11H11"/></svg>
      </button>
      <button id="btn-redo" class="pill-btn" title="redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9.5a5.5 5.5 0 000 11H13"/></svg>
      </button>
      <button id="btn-clear" class="pill-btn" title="clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6.5 7l1 12a1 1 0 001 1h7a1 1 0 001-1l1-12"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
      <button id="btn-lock" class="pill-btn" title="lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>
      </button>
      <button id="btn-tools" class="pill-btn" title="all tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L13.4 20.6a2 2 0 01-2.8 0L2 12V2h10l8.6 8.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      </button>
    </div>
  </div>

  <div id="peer-toast" class="peer-toast hidden"></div>

  <div id="toolbar" class="glass">
    <div id="tools-row" class="tools-row">
      <button class="tool" data-tool="pan" title="Move">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><path d="M12 2L9.5 4.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5M2 12l2.5-2.5M2 12l2.5 2.5M22 12l-2.5-2.5M22 12l-2.5 2.5"/></svg>
      </button>
      <button class="tool active" data-tool="pen" title="Pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 4 5 8 5 11a5 5 0 01-10 0c0-3 2-7 5-11z"/><circle cx="12" cy="13" r="1.3"/><path d="M12 14.3v3.2"/></svg>
      </button>
      <button class="tool" data-tool="pencil" title="Pencil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <button class="tool" data-tool="marker" title="Marker">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 20l1.5-5L16 4.5a2.1 2.1 0 013 3L8.5 18 4 20z"/></svg>
      </button>
      <button class="tool" data-tool="highlighter" title="Highlighter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" stroke="none" d="M5 18.5l1.2-3.8L13.6 7.3a1.8 1.8 0 012.6 2.6l-7.4 7.4-3.8 1.2z"/><path d="M3 21.5h10"/></svg>
      </button>
      <button class="tool" data-tool="neon" title="Neon glow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.8.6 1.5 1.4 1.5 2.6h4c0-1.2.7-2 1.5-2.6A6 6 0 0012 3z"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5L13 8l5.5 5.5L12 20H7l-2.5-2.5v-1z"/><path d="M10.5 5.5l4 4"/></svg>
      </button>
      <button class="tool" data-tool="line" title="Line">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 17.5L17.5 6.5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="11" rx="2"/></svg>
      </button>
      <button class="tool" data-tool="circle" title="Circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="tool" data-tool="text" title="Text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
      </button>
    </div>
    <div class="controls-row">
      <div id="colors-row" class="colors-row"></div>
      <input id="inp-size" type="range" min="2" max="48" value="8" title="brush size">
    </div>
    <div id="font-row" class="font-row hidden"></div>
  </div>

  <div id="tool-tip" class="glass tool-tip hidden"></div>
  <div id="tool-flash" class="glass tool-flash hidden"></div>

  <div id="tools-backdrop" class="tools-backdrop hidden"></div>
  <div id="tools-sheet" class="glass tools-sheet hidden" role="dialog" aria-label="All tools">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Tools</div>
    <div id="tools-grid" class="tools-grid"></div>
  </div>

  <div id="text-overlay" class="glass hidden">
    <textarea id="inp-text" rows="3" maxlength="500" placeholder="Write something…"></textarea>
    <div class="text-btns">
      <button id="btn-text-ok" class="btn-accent small">Place</button>
      <button id="btn-text-cancel" class="btn-ghost small">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <button id="btn-delete" class="delete-btn hidden" title="Delete">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
